name: Build and publish package

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@master

      - name: Set release env
        run: |
          major_version=7 \
          && echo "MAJOR_VERSION=${major_version}" >> $GITHUB_ENV \
          && [[ $major_version = 5 ]] && echo "PROJECT_TARGET=netstandard2.1" >> $GITHUB_ENV || [[ $major_version = 6 ]] && echo "PROJECT_TARGET=net6.0" >> $GITHUB_ENV || [[ $major_version = 8 ]] && echo "PROJECT_TARGET=net8.0" >> $GITHUB_ENV || echo "PROJECT_TARGET=net9.0" >> $GITHUB_ENV \
          && echo "RELEASE_VERSION=7.7.7" >> $GITHUB_ENV

      - name: Setup .NET9 environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.x.x'

      - name: Build project
        run: |
          for p in $(find ./src -name *.csproj); do dotnet build $p --configuration Release; done

      # - name: Push to GitHub package registry
      #   run: dotnet nuget push "*.nupkg" -k ${{secrets.NUGETORGTOKEN}} -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Log path to NuGet package
        run: |
            echo "NuGet packages:"
            ls -la ./out/packages/ || echo "No packages directory found"
            find . -name "*.nupkg" -type f || echo "No .nupkg files found"